name: Verify prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Optional repository secret; unit tests never use it (they pin a scripted or no provider).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node experiments/telemetry/measure-local.mjs > /tmp/feedback-lens-local-smoke.json
      - run: npm run evaluate
      - run: git diff --exit-code -- docs/data/evaluation.json
      - run: npm run telemetry
      - run: git diff --exit-code -- docs/telemetry/requests.json docs/telemetry/results.json
      - run: npm run comparison:fixtures
      - run: git diff --exit-code -- experiments/comparison/fixtures
      - run: npm run study:citations
      - run: git diff --exit-code -- docs/research/citation-gap-results.json
      # Real provider calls; runs only when the repository secret GEMINI_API_KEY is set.
      - name: Live AI verification (optional)
        if: env.GEMINI_API_KEY != ''
        run: npm run verify:live
