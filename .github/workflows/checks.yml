name: Verify prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node experiments/telemetry/measure-local.mjs > /tmp/feedback-lens-local-smoke.json
      - run: npm run evaluate
      - run: npm run telemetry
      - run: git diff --exit-code -- docs/telemetry/requests.json docs/telemetry/results.json
      - run: npm run comparison:fixtures
      - run: git diff --exit-code -- experiments/comparison/fixtures
      - run: npm run study:citations
      - run: git diff --exit-code -- docs/research/citation-gap-results.json
