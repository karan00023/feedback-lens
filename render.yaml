# One-click hosting of the Feedback Lens server (UI + AI API) on Render's free web-service plan.
# Render asks for GEMINI_API_KEY when the Blueprint is created (it is never stored in the repo).
# The service accepts its own Render hostname automatically (RENDER_EXTERNAL_HOSTNAME).
services:
  - type: web
    name: feedback-lens
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.mjs
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://karan00023.github.io
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
